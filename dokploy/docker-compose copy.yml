# Stack monorepo para Dokploy + infra compartilhada (dokploy-manager: infra/shared).
#
# Variáveis injetadas pelo dokploy-manager (`env:up`): INSTANCE_HOST, INSTANCE_URL, APP_URL,
# NEXT_PUBLIC_API_URL (https://api.INSTANCE_HOST), ADMIN_URL (https://admin.INSTANCE_HOST).
# BASE_DOMAIN só existe no .env do dokploy-manager; não é passado a esta stack.
#
# Traefik:
#   api.${INSTANCE_HOST}    → Laravel
#   admin.${INSTANCE_HOST} → Laravel (mesmo backend; use ADMIN_URL na app)
#   app.${INSTANCE_HOST}   → Next.js

name: monorepo

services:

  traefik:
    image: traefik:v3.1
    container_name: koder-traefik
    restart: unless-stopped
    # Do not mount ./traefik as a whole: some Docker setups mis-bind paths under
    # /var/www/html (files appear as empty dirs inside the container). Static
    # config is inlined; only ./traefik/dynamic is mounted (see traefik.local.yml).
    command:
      - "--log.level=INFO"
      - "--accesslog=true"
      - "--accesslog.filepath=/var/log/traefik/access.log"
      - "--api.dashboard=true"
      - "--api.insecure=true"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.traefik.address=:8080"
      - "--providers.docker=true"
      - "--providers.docker.endpoint=unix:///var/run/docker.sock"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=shared_network_web"
      - "--providers.docker.watch=true"
      - "--providers.file.directory=/etc/traefik-config/dynamic"
      - "--providers.file.watch=true"
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/dynamic:/etc/traefik-config/dynamic:ro
      - ./data/traefik-logs:/var/log/traefik
    networks:
      - shared_network_web
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=shared_network_web"
      # api@internal requires matching /api and /dashboard (Traefik v3 docs).
      - "traefik.http.routers.traefik-dashboard.rule=Host(`traefik.${BASE_DOMAIN:-localhost}`) && (PathPrefix(`/api`) || PathPrefix(`/dashboard`))"
      - "traefik.http.routers.traefik-dashboard.entrypoints=web"
      - "traefik.http.routers.traefik-dashboard.service=api@internal"

  api-php:
    build:
      context: .
      dockerfile: Dockerfile.api-php
    container_name: monorepo-api-php
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ../api-laravel:/var/www/html
    environment:
      APP_NAME: ${APP_NAME:-Laravel}
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_KEY: ${APP_KEY}
      APP_URL: ${APP_URL}
      INSTANCE_HOST: ${INSTANCE_HOST}
      INSTANCE_URL: ${INSTANCE_URL}
      ADMIN_URL: ${ADMIN_URL}
      LOG_CHANNEL: ${LOG_CHANNEL:-stderr}
      DB_CONNECTION: ${DB_CONNECTION:-mysql}
      DB_HOST: ${DB_HOST:-infra-shared-mysql}
      DB_PORT: ${DB_PORT:-3306}
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
    networks:
      - shared_network_db
      - dokploy_internal

  api-nginx:
    image: nginx:alpine
    container_name: monorepo-api-nginx
    restart: unless-stopped
    volumes:
      - ../api-laravel:/var/www/html:ro
      - ./nginx/laravel.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api-php
    networks:
      - shared_network_web
      - dokploy_internal
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=shared_network_web"
      - "traefik.http.routers.monorepo-api-http.rule=Host(`api-${INSTANCE_HOST}`)"
      - "traefik.http.routers.monorepo-api-http.entrypoints=web"
      - "traefik.http.routers.monorepo-api-http.middlewares=redirect-to-https@file"
      - "traefik.http.routers.monorepo-api-http.service=monorepo-api-php-svc"
      - "traefik.http.routers.monorepo-api-https.rule=Host(`api-${INSTANCE_HOST}`)"
      - "traefik.http.routers.monorepo-api-https.entrypoints=websecure"
      - "traefik.http.routers.monorepo-api-https.tls=true"
      - "traefik.http.routers.monorepo-api-https.tls.certresolver=le"
      - "traefik.http.routers.monorepo-api-https.service=monorepo-api-php-svc"
      - "traefik.http.services.monorepo-api-php-svc.loadbalancer.server.port=80"

  frontend-node:
    image: node:22-alpine
    container_name: monorepo-frontend-node
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ../frontend-client:/app
    environment:
      HOSTNAME: "0.0.0.0"
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    command: sh -c "npm ci --include=dev && NODE_ENV=production npm run build && NODE_ENV=production exec ./node_modules/.bin/next start -H 0.0.0.0 -p 3000"
    networks:
      - shared_network_web
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=shared_network_web"
      - "traefik.http.routers.monorepo-frontend-http.rule=Host(`${INSTANCE_HOST}`)"
      - "traefik.http.routers.monorepo-frontend-http.entrypoints=web"
      - "traefik.http.routers.monorepo-frontend-http.middlewares=redirect-to-https@file"
      - "traefik.http.routers.monorepo-frontend-http.service=monorepo-frontend-svc"
      - "traefik.http.routers.monorepo-frontend-https.rule=Host(`${INSTANCE_HOST}`)"
      - "traefik.http.routers.monorepo-frontend-https.entrypoints=websecure"
      - "traefik.http.routers.monorepo-frontend-https.tls=true"
      - "traefik.http.routers.monorepo-frontend-https.tls.certresolver=le"
      - "traefik.http.routers.monorepo-frontend-https.service=monorepo-frontend-svc"
      - "traefik.http.services.monorepo-frontend-svc.loadbalancer.server.port=3000"
  
  teste:
    image: nginx:alpine
    container_name: html_test
    ports:
      - "9192:80"
    volumes:
      - ./html:/usr/share/nginx/html:ro

networks:
  shared_network_db:
    external: true
    name: shared_network_db
  shared_network_web:
    external: true
    name: shared_network_web
  dokploy_internal:
    driver: bridge
