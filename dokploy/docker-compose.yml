name: monorepo

services:

  api-php:
    build:
      context: .
      dockerfile: Dockerfile.api-php
    container_name: ${INSTANCE_HOST}-api-php
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ../api-laravel:/app
    environment:
      APP_NAME: ${APP_NAME:-Laravel}
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_KEY: ${APP_KEY}
      APP_URL: ${APP_URL}
      INSTANCE_HOST: ${INSTANCE_HOST:-monorepo.koder.test}
      INSTANCE_URL: ${INSTANCE_URL}
      ADMIN_URL: ${ADMIN_URL}
      LOG_CHANNEL: ${LOG_CHANNEL:-stderr}
      DB_CONNECTION: ${DB_CONNECTION:-mysql}
      DB_HOST: ${DB_HOST:-infra-shared-mysql}
      DB_PORT: ${DB_PORT:-3306}
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
    networks:
      - dokploy-network
      - dokploy_internal

  api-nginx:
    image: nginx:alpine
    container_name: ${INSTANCE_HOST}-api-nginx
    restart: unless-stopped
    volumes:
      - ../api-laravel:/app:ro
      - ./nginx/laravel.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api-php
    networks:
      - dokploy-network
      - dokploy_internal
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.monorepo-api-web.rule=Host(`api-${INSTANCE_HOST}`)"
      - "traefik.http.routers.monorepo-api-web.entrypoints=web"
      - "traefik.http.routers.monorepo-api-websecure.rule=Host(`api-${INSTANCE_HOST}`)"
      - "traefik.http.routers.monorepo-api-websecure.entrypoints=websecure"
      - "traefik.http.routers.monorepo-api-web.service=monorepo-api-php-svc"
      - "traefik.http.routers.monorepo-api-websecure.service=monorepo-api-php-svc"
      - "traefik.http.services.monorepo-api-php-svc.loadbalancer.server.port=80"

  frontend-node:
    image: node:22-alpine
    container_name: ${INSTANCE_HOST}-frontend
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ../frontend-client:/app
    environment:
      HOSTNAME: "0.0.0.0"
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    command: sh -c "npm ci --include=dev && NODE_ENV=production npm run build && NODE_ENV=production exec ./node_modules/.bin/next start -H 0.0.0.0 -p 3000"
    networks:
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.monorepo-frontend-web.rule=Host(`${INSTANCE_HOST}`)"
      - "traefik.http.routers.monorepo-frontend-web.entrypoints=web"
      - "traefik.http.routers.monorepo-frontend-web.service=monorepo-frontend-svc"
      - "traefik.http.routers.monorepo-frontend-websecure.rule=Host(`${INSTANCE_HOST}`)"
      - "traefik.http.routers.monorepo-frontend-websecure.entrypoints=websecure"
      - "traefik.http.routers.monorepo-frontend-websecure.service=monorepo-frontend-svc"
      - "traefik.http.services.monorepo-frontend-svc.loadbalancer.server.port=3000"
  

networks:
  dokploy-network:
    external: true
    name: dokploy-network
  dokploy_internal:
    driver: bridge